<header class="w-full p-3 bg-gradient-to-r from-primary to-black fixed top-0 z-50">
    <div class="flex align-middle items-center mx-auto px-6">
        <a class="flex items-center text-white pr-6 max-h-16 gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                <path
                    d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z" />
            </svg>
            <h3 class="font-semibold uppercase text-2xl">
                The Social Network
            </h3>
        </a>
        <nav class="flex gap-3 my-2 text-white text-lg uppercase">
            <a>Matches</a>
            <a>Lists</a>
            <a>Messages</a>
        </nav>
        @if (accountService.currentUser(); as user) {
            <div class="dropdown dropdown-end ml-auto">
                <button type="button" tabindex="0"
                        class="flex items-center cursor-pointer gap-2 border-0 bg-transparent p-0 text-white shadow-none">
                    <img src="/user.png" alt="" class="size-10 rounded-full">
                    <span>{{user.displayName}}</span>
                </button>

                <ul tabindex="0" class="dropdown-content menu w-52 rounded-box bg-base-100 shadow-sm">
                    <li><a>Edit Profile</a></li>
                    <li><a (click)="logout()">Logout</a></li>
                </ul>
            </div>
        }
        @else {
        <div class="flex align-middle ml-auto gap-3">
            <form #loginForm="ngForm" (ngSubmit)="login()" /*notice the even is on the form and not the button*/
                class="flex items-center gap-3">
                <input [(ngModel)]="creds.email" name="email" type="text" class="input" placeholder="Email">
                <input [(ngModel)]="creds.password" name="password" type="password" class="input"
                    placeholder="Password">
                <button class="btn">Sign In</button>
            </form>
        </div>
        }

    </div>
</header>
